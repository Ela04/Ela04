name: Generate Galaga contribution graph

on:
  # Se ejecuta automáticamente cada medianoche
  schedule:
    - cron: "0 0 * * *"
  # Permite ejecutar el flujo manualmente desde la pestaña Actions en GitHub
  workflow_dispatch:
  # Se ejecuta al hacer push a la rama principal
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Genera el SVG de Galaga (versiones clara y oscura) a partir de las contribuciones
      - name: generate galaga contribution graph
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "galaga"
          hide_month_labels: "false"

      # Sube los archivos generados a la rama 'output'
      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
