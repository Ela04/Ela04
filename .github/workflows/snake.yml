name: Generate Snake Matrix Game

on:
  # Se ejecuta automáticamente cada medianoche
  schedule:
    - cron: "0 0 * * *"
  # Permite ejecutar el flujo manualmente desde la pestaña Actions en GitHub
  workflow_dispatch:
  # Se ejecuta al hacer push a la rama principal
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Genera la animación SVG de la serpiente
      - name: generate-github-user-contribution-grid-snake-svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Ela04
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Sube los archivos generados a la rama 'output'
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
